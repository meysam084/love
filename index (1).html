<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برای مهدیه جونم 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #2a162b 0%, #170f1a 50%, #0d090e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* هاله‌های نوری صورتی و بنفش رویایی */
    .glow-1 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.25) 0%, transparent 70%);
      top: 10%;
      left: 15%;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .glow-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
      bottom: 10%;
      right: 15%;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      animation: floatGlow 7s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 20px) scale(1.15); }
    }

    /* پارتیکل‌های درخشان پس‌زمینه */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fbcfe8;
      border-radius: 50%;
      box-shadow: 0 0 10px #f472b6, 0 0 20px #f472b6;
      pointer-events: none;
      opacity: 0.5;
      animation: twinkle 3s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.9; transform: scale(1.3); }
    }

    /* کارت شیشه‌ای اصلی */
    .container {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 114, 182, 0.22);
      border-radius: 32px;
      padding: 38px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(236, 72, 153, 0.12);
      z-index: 10;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 18px;
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: #fbcfe8;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 12px;
      line-height: 1.4;
      background: linear-gradient(135deg, #ffffff 30%, #fbcfe8 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.2);
    }

    .subtitle {
      font-size: 0.98rem;
      color: #e2e8f0;
      line-height: 1.8;
      margin-bottom: 30px;
      font-weight: 400;
    }

    /* شبکه تایمر معکوس */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 28px;
      direction: rtl;
    }

    .time-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(244, 114, 182, 0.2);
      border-radius: 20px;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(244, 114, 182, 0.06);
    }

    .time-number {
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
    }

    .time-label {
      font-size: 0.75rem;
      color: #f9a8d4;
      margin-top: 5px;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(244, 114, 182, 0.3), transparent);
      margin-bottom: 22px;
    }

    .note {
      font-size: 1.05rem;
      color: #fdf2f8;
      line-height: 1.85;
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* دکمه دخترونه با افکت درخشان */
    .btn {
      background: linear-gradient(135deg, #ec4899 0%, #d946ef 50%, #a855f7 100%);
      color: #fff;
      border: none;
      outline: none;
      padding: 13px 30px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(236, 72, 153, 0.4);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 35px rgba(236, 72, 153, 0.55);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* کارت باز شونده */
    .hidden-message {
      display: none;
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 20px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.8;
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* انیمیشن پرتاب قلب‌ها */
    .floating-heart {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      animation: floatHeart 2.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translateY(-130px) scale(1.2) rotate(15deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-260px) scale(1.4) rotate(-15deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- نقطه‌های درخشان رندوم -->
  <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="sparkle" style="top: 25%; right: 22%; animation-delay: 1s;"></div>
  <div class="sparkle" style="top: 70%; left: 18%; animation-delay: 1.5s;"></div>
  <div class="sparkle" style="top: 80%; right: 25%; animation-delay: 0.5s;"></div>

  <main class="container">
    <div class="badge">
      <span>⏳</span>
      <span>ثانیه‌شمار تا دوباره دیدنت...</span>
    </div>
    
    <h1>مهدیه جونم زندگیم 💖</h1>
    
    <p class="subtitle">
      می‌دونم از دستم ناراحتی، ولی سعی کن نباشی فداتشم، باشه دنیام؟!
    </p>

    <div class="countdown-grid">
      <div class="time-card">
        <span class="time-number" id="days">00</span>
        <span class="time-label">روز</span>
      </div>
      <div class="time-card">
        <span class="time-number" id="hours">00</span>
        <span class="time-label">ساعت</span>
      </div>
      <div class="time-card">
        <span class="time-number" id="minutes">00</span>
        <span class="time-label">دقیقه</span>
      </div>
      <div class="time-card">
        <span class="time-number" id="seconds">00</span>
        <span class="time-label">ثانیه</span>
      </div>
    </div>

    <div class="divider"></div>

    <p class="note">
      خیلی دوستت دارم قلبم ❤️<br>
      چیزی تا دیدارمون نمونده دنیام...
    </p>

    <button class="btn" id="promiseBtn" onclick="revealPromise()">
      <span>یه راز کوچیک از قلبم برات...</span>
      <span>💌</span>
    </button>

    <div class="hidden-message" id="secretMsg">
      مهدیه جونم خیلییی دوستت دارم قلبم منتظرم بیایی تا کلی بغلت کنم 💕🫂
    </div>
  </main>

  <script>
    // تنظیم یک زمان هدف ثابت (Fixed Timestamp)
    // دقیقا 6 روز و 12 ساعت از اولین باز شدن، ذخیره در حافظه و اشتراک بین جلسات
    const DURATION_MS = (6 * 24 * 60 * 60 * 1000) + (12 * 60 * 60 * 1000);
    
    // اگر در localStorage نبود، تاریخ هدف را الان + 6 روز و 12 ساعت ست می‌کند
    let storedTarget = localStorage.getItem("mahdieh_arrival_target");
    let targetTime;

    if (!storedTarget) {
      targetTime = Date.now() + DURATION_MS;
      localStorage.setItem("mahdieh_arrival_target", targetTime);
    } else {
      targetTime = parseInt(storedTarget, 10);
    }

    function updateCountdown() {
      const now = Date.now();
      const distance = targetTime - now;

      if (distance <= 0) {
        document.querySelector('.countdown-grid').innerHTML = 
          "<div style='grid-column: span 4; font-size: 1.3rem; font-weight: bold; color: #fbcfe8; padding: 15px;'>بالاخره رسیدی دنیام... خوش اومدی! 💖</div>";
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = d < 10 ? '0' + d : d;
      document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
      document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
      document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function revealPromise() {
      const msg = document.getElementById("secretMsg");
      const btn = document.getElementById("promiseBtn");
      
      msg.style.display = "block";
      btn.style.display = "none";

      const hearts = ['💖', '💕', '🌸', '✨', '🤍'];
      for (let i = 0; i < 22; i++) {
        setTimeout(() => {
          createHeart(hearts[Math.floor(Math.random() * hearts.length)]);
        }, i * 80);
      }
    }

    function createHeart(emoji) {
      const heart = document.createElement("div");
      heart.classList.add("floating-heart");
      heart.innerText = emoji;
      heart.style.left = (Math.random() * 80 + 10) + "vw";
      heart.style.bottom = "15vh";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 2800);
    }
  </script>
</body>
</html>
